definition_version: "2"

entities:
  snowdash:
    type: snowflake-app
    identifier:
      name: SNOWDASH
      database: GRUPOMULTI_ADMIN
      schema: SNOWDASH_APP
    artifacts:
      - src: ./*
        dest: ./
        ignore:
          - node_modules
          - .env*
          - __pycache__
          - "*.pyc"
          - .next
          - .git
          - snowflake.log
          - "snowflake.*.yml"
          - .DS_Store
          - "*.tsbuildinfo"
          - output

    query_warehouse: WH_MLK_SETUP
    code_workspace: GRUPOMULTI_ADMIN.SNOWDASH_APP.SNOWFLAKE_APPS

  snowdash_coverys_dev:
    type: snowflake-app
    identifier:
      name: SNOWDASH
      database: F_RFERREIRA_EDW
      schema: SNOWDASH
    artifacts:
      - src: ./*
        dest: ./
        ignore:
          - node_modules
          - .env*
          - __pycache__
          - "*.pyc"
          - .next
          - .git
          - snowflake.log
          - "snowflake.*.yml"
          - .DS_Store
          - "*.tsbuildinfo"
          - output

    query_warehouse: REPORTING_XSMALL
    code_workspace: F_RFERREIRA_EDW.SNOWDASH.SNOWFLAKE_APPS
