install:
  commands:
    - ["npm", "ci", "--include=dev"]

build:
  commands:
    - ["npm", "run", "build"]
    # For standalone mode
    - ["cp", "-r", ".next/static", ".next/standalone/.next/static"]
    - ["cp", "-r", "public", ".next/standalone/public"]
    # Avoid packaging extra node_modules since standalone includes its own
    - ["rm", "-rf", "node_modules"]

run:
  command: ["node", ".next/standalone/server.js"]

# No `version:` key here means this is the build-only manifest: the phases above are
# the build/run config, and `snowflake.yml` says where the app is deployed. If
# `snow app setup` generated an `app.yml` with `version: 2` instead, that one file
# carries both — keep the phases above and add the generated deployment keys to it,
# leaving a single `app.yml`. See the skill's references/manifests.md.

# Secrets read via getSecret(name, type) in lib/snowflake.ts must be declared here so
# the SPCS runtime mounts them under /secrets/<name>/. Map a logical `name` to an
# existing Snowflake SECRET object. `secrets:` (and `environment_variables:`) are
# TOP-LEVEL keys — siblings of install/run at column 0, in both manifest layouts.
# Do NOT nest them under `run:`. Uncomment when the app uses secrets.
# See README → Secrets.
# secrets:
#   - name: SOME_API_KEY
#     secret: DB.SCHEMA.API_KEY
#   - name: SOME_USER_PASS
#     secret: DB.SCHEMA.API_KEY_2
#
# environment_variables:
#   - name: LOG_LEVEL
#     value: "INFO"

profile:
  label: "SnowDash"
  description: "Tableau-style drag-and-drop pivot analysis over tables, views, joined models and semantic views, with saved SnowBooks."
  icon: public/icon.png
# SNOWDASH_BOOKS_TABLE defaults to <service db>.<service schema>.SNOWBOOKS.

environment_variables:
  # Services in these databases browse/query data with OWNER's rights (no caller
  # grants there). Coverys DEV only — every user sees what EDW_ADMIN sees.
  - name: SNOWDASH_OWNER_RIGHTS_DBS
    value: "F_RFERREIRA_EDW"
  # Logins allowed to use /api/admin/queries (list/cancel the service user's own queries).
  - name: SNOWDASH_ADMIN_USERS
    value: "DEV_RFERREIRA"
  # Admin cancel only acts when the service runs as this user (Coverys DEV service user).
  - name: SNOWDASH_SERVICE_USER
    value: "MANAGED_SERVICE_1"
  # Pivot shelf limits "rows,columns,values": default for everyone; ceiling for SNOWDASH_ADMIN_USERS.
  - name: SNOWDASH_LIMITS_DEFAULT
    value: "8,4,12"
  - name: SNOWDASH_LIMITS_MAX
    value: "16,8,30"
